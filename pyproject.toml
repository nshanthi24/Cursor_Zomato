[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-recommendations"
version = "0.1.0"
description = "Restaurant recommendations from the Zomato Bangalore catalog."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn[standard]==0.54.0",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "datasets==5.2.0",
    "httpx==0.28.1",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",
    "jinja2==3.1.6",
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
